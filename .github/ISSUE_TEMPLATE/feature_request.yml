name: 功能建议
description: 想要新能力、新节点、新体验，用这个表单
title: "[Feature] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议。说清楚「你现在的处境」比说「我要一个按钮」更有用——我们更想知道你卡在哪。

  - type: textarea
    id: scene
    attributes:
      label: 使用场景
      description: 你在做什么事情时觉得不方便？
      placeholder: 例如：我在做 20 集的分集短剧，每集都要手动改一遍角色描述，改漏了人物就崩
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的效果
      description: 你希望软件怎么帮你解决
      placeholder: 例如：能不能建一个「角色库」，节点里直接引用角色名就自动带上描述
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案
      description: 现在你是怎么绕过这个问题的（有的话）
      placeholder: 例如：我建了一个文本节点专门存角色描述，每次手动连引用
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及的模块
      options:
        - 画布与节点操作
        - 图片生成
        - 视频生成
        - 音频生成
        - Agent 对话
        - 文件与素材管理
        - 界面与交互
        - 安装与更新
        - 其他
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考截图、类似产品的做法、手绘草图，都可以
    validations:
      required: false
